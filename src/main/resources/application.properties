spring.application.name=api-gateway

server.port=${APP_PORT:8082}
spring.main.web-application-type=reactive

gateway.services.user-url=${USER_SERVICE_URL:http://localhost:8080}
gateway.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

gateway.jwt.issuer=authentication-service
gateway.jwt.audience=java-advanced-api
gateway.jwt.public-key=${JWT_PUBLIC_KEY:file:../authentication-service/secrets/public-key.pem}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

gateway.registration-key=${AUTH_REGISTRATION_KEY}